{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scarlet Roasters{% endblock %}</title>
  <!-- Bootstrap 5.3 from a CDN: one line, and every page is responsive -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own stylesheet, served by Django's staticfiles app -->
  <link href="{% static 'css/scarlet.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-md navbar-dark bg-scarlet">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">
        <img src="{% static 'img/mark.svg' %}" alt="" width="28" height="28" class="me-2 align-text-bottom">Scarlet Roasters
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'catalog' %}active{% endif %}" href="{% url 'catalog' %}">Catalog</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">About</a></li>
          <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 text-muted small">
    <div class="container d-flex flex-wrap justify-content-between">
      <span>&copy; Scarlet Roasters &middot; New Brunswick, NJ</span>
      <span>Wholesale &amp; retail coffee, roasted weekly</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
